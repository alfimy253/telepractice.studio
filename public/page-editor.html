<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canopy Studio — Page editor</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f5f0; color: #24352e; font: 13px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    .editor-bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: #fff; border-bottom: 1px solid #e6e8e2; }
    .editor-bar strong { font-size: 13px; }
    .editor-hint { flex: 1; min-width: 0; color: #76837b; font-size: 11px; }
    .editor-count { color: #376f62; font-size: 11px; font-weight: 700; }
    .editor-status { font-size: 11px; color: #76837b; }
    .editor-status.error { color: #a75c4e; }
    .export-button { border: 0; border-radius: 6px; background: #376f62; color: #fff; font-size: 12px; font-weight: 700; padding: 9px 16px; cursor: pointer; }
    .export-button:disabled { opacity: .55; cursor: wait; }
    .editor-stage { padding: 18px; }
    .editor-frame { display: block; width: 100%; height: calc(100vh - 130px); border: 1px solid #e6e8e2; border-radius: 10px; background: #fff; }
  </style>
  <script type="module" src="/page-editor.js"></script>
</head>
<body>
  <header class="editor-bar">
    <strong>Page editor</strong>
    <span class="editor-hint">Click any plain text on the page to edit it. The builder preview updates when you export.</span>
    <span class="editor-count" id="editCount" hidden></span>
    <span class="editor-status" id="editorStatus" aria-live="polite"></span>
    <button class="export-button" id="exportButton" type="button">Export to builder</button>
  </header>
  <main class="editor-stage">
    <iframe class="editor-frame" id="editorFrame" title="Editable page preview" referrerpolicy="no-referrer"></iframe>
  </main>
</body>
</html>
